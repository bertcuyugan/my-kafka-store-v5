version: 2

models:
  - name: fct_order_journey
    description: "One row per order with status and timings. Replaces gold_order_journey."
    columns:
      - name: order_number
        data_tests: [unique, not_null]
      - name: current_status
        description: "placed → paid → shipped → delivered"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'paid', 'shipped', 'delivered']

  - name: fct_order_events
    description: "Every Kafka event of every type. Incremental (merge on event_id)."
    columns:
      - name: event_uid
        description: "event_id + Kafka timestamp. Unique even when Kafka offsets restart."
        data_tests: [ unique, not_null ]
      - name: event_id
        data_tests: [ not_null ]
     #- name: event_id
     #  data_tests: [unique, not_null]
     #- name: event_type
     #  data_tests:
     #    - accepted_values:
     #        arguments:
     #          values: ['order-placed', 'payment-received', 'item-shipped', 'item-delivered']

  - name: dim_customers
    description: "One row per customer email. Replaces gold_customers."
    columns:
      - name: customer_email
        data_tests: [unique, not_null]

  - name: agg_daily_revenue
    description: "Orders, units and revenue per day. Replaces gold_daily_revenue."
    columns:
      - name: order_date
        data_tests: [unique, not_null]

  - name: agg_top_products
    description: "Sales per product. Replaces gold_top_products."
    columns:
      - name: item
        data_tests: [unique, not_null]

  - name: agg_fulfilment_kpis
    description: "Single-row fulfilment KPIs. Replaces gold_fulfilment_kpis."