version: 2

models:
  - name: stg_db__users
    description: "Registered customers from PostgreSQL (latest snapshot)."
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: customer_email
        data_tests: [unique, not_null]

  - name: stg_db__products
    description: "Product catalogue from PostgreSQL (latest snapshot)."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: price
        data_tests: [not_null]

  - name: stg_db__orders
    description: "Orders from PostgreSQL (latest snapshot), including unpaid 'pending' ones."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_number
        data_tests: [unique, not_null]
      - name: db_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'paid', 'shipped', 'delivered']
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_db__products')
                field: product_id
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_db__users')
                field: user_id

  - name: stg_db__payments
    description: "Payments from PostgreSQL (latest snapshot)."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_db__orders')
                field: order_id

  - name: stg_db__shipments
    description: "Shipments from PostgreSQL (latest snapshot)."
    columns:
      - name: shipment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_db__orders')
                field: order_id
      - name: shipment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['processing', 'shipped', 'delivered']
