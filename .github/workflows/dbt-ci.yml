name: dbt CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# One run per PR at a time; a newer push cancels the older run
concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
  DBT_CATALOG: workspace
  DBT_SCHEMA: ci_pr_${{ github.event.pull_request.number }}

jobs:

  # ── Build & test the changed models in a temporary schema ─────────
  dbt-build:
    name: dbt-build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v6

      - name: Check out main (production state to compare against)
        uses: actions/checkout@v6
        with:
          ref: main
          path: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r requirements-dbt.txt python-dotenv==1.1.0

      - name: Check the Databricks connection
        run: python run_dbt.py debug

      - name: Parse main's project as production
        env:
          DBT_SCHEMA: kafka_store_v5_dbt
        run: python main/run_dbt.py parse --target-path "${{ github.workspace }}/main-state"

      - name: Build and test changed models (+ downstream) in ci_pr_${{ github.event.pull_request.number }}
        run: >
          python run_dbt.py build
          --select state:modified+
          --defer
          --state "${{ github.workspace }}/main-state"
          --fail-fast
  # ── Drop the temporary schemas when the PR is merged or closed ────
  cleanup:
    name: cleanup
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the PR's last commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r requirements-dbt.txt python-dotenv==1.1.0

      - name: Drop ci_pr_${{ github.event.pull_request.number }} schemas
        run: python run_dbt.py run-operation drop_ci_schemas